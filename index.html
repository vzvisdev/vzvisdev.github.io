<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOW</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background-color: #fdfff6;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      
      position: relative;      /* 🔥 REQUIRED FOR STICKERS */
      overflow-x: hidden;      /* 🔥 FIX MOBILE SCROLL */
      overflow-y: auto;
    }

    /* --- MENÚ MINIMALISTA STICKY --- */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      background-color: #fdfff6;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .logo:hover {
      opacity: 0.6;
    }

    .logo-img {
      height: 32px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #333333;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.8px;
      transition: opacity 0.3s ease;
    }

    .nav-links a:hover {
      opacity: 0.5;
    }

    /* --- CONTENEDOR HERO CON LUPA --- */
    .container {
      position: relative;
      width: 100%;
      height: calc(100vh - 73px);
      min-height: 500px;
      overflow: hidden;
      cursor: crosshair;
      border-radius: 0;
      touch-action: none;
      
      background: radial-gradient(circle at center, #310f50 0%, #03001c 70%);
      box-shadow: inset 0 0 15px rgba(187, 78, 138, 0.2);
    }

    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .render-layer {
      background-image: url('render.png');
      z-index: 1;
    }

    .glow-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 10px #ff77c2) 
              drop-shadow(0 0 25px #c25898) 
              drop-shadow(0 0 50px #c25898);
      mix-blend-mode: screen;
    }

    .wireframe-layer {
      background-image: url('wireframe.png');
      clip-path: path("M 0 0");
      will-change: clip-path, filter;
      z-index: 3;
      filter: brightness(1.25) contrast(1.1) drop-shadow(0 0 10px rgba(255, 188, 226, 0.6));
    }

    /* --- GALERÍA DE CUADROS EN LA PARED --- */
    .wall-gallery {
      width: 100%;
      max-width: 1280px;
      padding: 100px 32px 140px 32px;
      background-color: #fdfff6;
      
      /* Grid asimétrico tipo galería de arte */
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 36px;
      align-items: center;
    }

    /* Estilo de Marco Elegante */
    .frame {
      position: relative;
      padding: 0;
      border: none;
      background-color: transparent;
      box-shadow: 
        0 10px 30px -5px rgba(0, 0, 0, 0.08),
        0 20px 25px -5px rgba(0, 0, 0, 0.04);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .frame-img-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f2f2ed;
      border: none;
      outline: none;
    }

    .frame-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: none;
      outline: none;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .frame:hover .frame-img-wrapper img {
      transform: scale(1.04);
    }

    /* Gallery Wall Layout (7 Frames) */
    .frame-1 { grid-column: span 7; height: 460px; }
    .frame-2 { grid-column: span 5; height: 380px; margin-top: 40px; }

    .frame-3 { grid-column: span 4; height: 420px; margin-top: -20px; }
    .frame-4 { grid-column: span 4; height: 350px; }
    .frame-5 { grid-column: span 4; height: 440px; margin-top: -30px; }

    .frame-6 { grid-column: span 6; height: 380px; margin-top: 20px; }
    .frame-8 { grid-column: span 6; height: 380px; margin-top: 20px; }

    /* --- FOOTER / SOCIAL MEDIA LINKS --- */
    .footer {
      width: 100%;
      padding: 40px 32px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      background-color: #fdfff6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .footer-title {
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666666;
    }

    .social-links {
      display: flex;
      gap: 28px;
      list-style: none;
      align-items: center;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #333333;
      text-decoration: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .social-link:hover {
      opacity: 0.5;
      transform: translateY(-2px);
    }

    .social-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .copyright {
      font-size: 0.8rem;
      color: #999999;
      font-weight: 300;
      margin-top: 8px;
    }

    /* --- RESPONSIVE OVERRIDES --- */
    @media (max-width: 900px) {
      .wall-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        padding: 60px 20px 80px 20px;
      }

      .frame-1, .frame-2, .frame-3, .frame-4, .frame-5, .frame-6, .frame-8 {
        grid-column: span 1 !important;
        margin-top: 0 !important;
        height: 350px !important;
      }
    }

    @media (max-width: 600px) {
      .wall-gallery {
        grid-template-columns: 1fr;
      }
    }

    /* VERY SMALL PHONES */
    @media (max-width: 480px) {
      .deco-2,
      .deco-4 {
        display: none;
      }
    }
  </style>
</head>

  <script>
    const container = document.getElementById('revealBox');
    const wireframe = document.getElementById('wireframe');
    const glowPath = document.getElementById('glowPath');

    const R = 135;
    const r = 43;
    const smooth = 22;

    let ticking = false;

    function updateSpotlight(e) {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const d = [
        `M ${x} ${y - R}`,
        `C ${x} ${y - R}, ${x + r - smooth} ${y - r - smooth}, ${x + r} ${y - r}`,
        `C ${x + r + smooth} ${y - r + smooth}, ${x + R} ${y}, ${x + R} ${y}`,
        `C ${x + R} ${y}, ${x + r + smooth} ${y + r - smooth}, ${x + r} ${y + r}`,
        `C ${x + r - smooth} ${y + r + smooth}, ${x} ${y + R}, ${x} ${y + R}`,
        `C ${x} ${y + R}, ${x - r + smooth} ${y + r + smooth}, ${x - r} ${y + r}`,
        `C ${x - r - smooth} ${y + r - smooth}, ${x - R} ${y}, ${x - R} ${y}`,
        `C ${x - R} ${y}, ${x - r - smooth} ${y - r + smooth}, ${x - r} ${y - r}`,
        `C ${x - r + smooth} ${y - r - smooth}, ${x} ${y - R}, ${x} ${y - R}`,
        `Z`
      ].join(' ');

      wireframe.style.clipPath = `path("${d}")`;
      glowPath.setAttribute('d', d);
      glowPath.setAttribute('opacity', '1');
    }

    function onPointerMove(e) {
      if (!ticking) {
        requestAnimationFrame(() => {
          updateSpotlight(e);
          ticking = false;
        });
        ticking = true;
      }
    }

    function resetSpotlight() {
      wireframe.style.clipPath = 'path("M 0 0")';
      glowPath.setAttribute('opacity', '0');
    }

    container.addEventListener('pointerdown', onPointerMove);
    container.addEventListener('pointermove', onPointerMove);
    container.addEventListener('pointerleave', resetSpotlight);
    container.addEventListener('pointerup', resetSpotlight);

    // Prevent image context menu
    document.querySelectorAll("img").forEach(img => {
      img.addEventListener("contextmenu", e => e.preventDefault());
    });
  </script>
