<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background-color: #fdfff6;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* --- DECORATIVE IMAGES --- */
    .deco {
      position: fixed;      /* desktop behavior */
      z-index: -1;
      opacity: 0.7;
      pointer-events: none;
      max-width: 100vw;
    }

    .deco-1 { bottom: 25%; left: -60px; width: 270px; }
    .deco-2 { bottom: 20%; left: 240px; width: 120px; }
    .deco-3 { bottom: 1%;  left: -40px; width: 350px; }
    .deco-4 { bottom: 45%; right: 120px; width: 120px; }
    .deco-5 { bottom: 25%; right: -20px; width: 140px; }
    .deco-6 { bottom: -3%; right: 15px;  width: 270px; }

    /* --- HEADER --- */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background-color: #fdfff6;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .logo:hover {
      opacity: 0.6;
    }

    .logo-img {
      height: 32px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #333333;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.8px;
      transition: opacity 0.3s ease;
    }

    .nav-links a:hover {
      opacity: 0.5;
    }

    /* --- GALLERY INTRO --- */
    .gallery-intro {
      width: 100%;
      max-width: 1280px;
      padding: 40px 32px 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gallery-title {
      color: #333333;
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.8px;
    }

    .back-link {
      color: #bb4e8a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.8px;
      transition: opacity 0.3s ease;
    }

    .back-link:hover {
      opacity: 0.5;
    }

    /* --- GALLERY GRID --- */
    .gallery-grid {
      width: 100%;
      max-width: 1280px;
      padding: 20px 32px 120px 32px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
      align-items: start;
    }

    .art-card {
      position: relative;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.02);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .art-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.12), 0 8px 16px -6px rgba(187, 78, 138, 0.15);
    }

    .art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .art-card:hover img {
      transform: scale(1.02);
    }

    /* --- SPAN & ASPECT RATIO HELPERS --- */
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    .ratio-hero-row { aspect-ratio: 4 / 3; }
    .ratio-square { aspect-ratio: 1 / 1; }
    .ratio-tall-portrait { aspect-ratio: 3300 / 5100; }
    .ratio-portrait-18 { aspect-ratio: 1080 / 1318; }
    .ratio-portrait-19 { aspect-ratio: 774 / 1024; }
    .ratio-landscape-13 { aspect-ratio: 1890 / 1045; }
    .ratio-landscape-14 { aspect-ratio: 1920 / 1080; }
    .ratio-landscape-15 { aspect-ratio: 7200 / 5400; }
    .ratio-landscape-16 { aspect-ratio: 8100 / 5700; }
    .ratio-landscape-17 { aspect-ratio: 6000 / 5100; }

    /* --- LIGHTBOX MODAL --- */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
      padding: 40px;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lightbox.active .lightbox-img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      color: #ffffff;
      font-size: 2rem;
      font-weight: 300;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease, transform 0.2s ease;
      user-select: none;
    }

    .lightbox-close:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* --- FOOTER --- */
    .footer {
      width: 100%;
      padding: 40px 32px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      background-color: #fdfff6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .social-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .social-link {
      color: #333333;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .social-link:hover {
      opacity: 0.5;
    }

    .social-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .copyright {
      font-size: 0.8rem;
      color: #999999;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* --- RESPONSIVE LAYOUT BREAKPOINTS --- */
    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        padding: 20px 20px 80px 20px;
      }

      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 {
        grid-column: span 1 !important;
      }
    }

    @media (max-width: 550px) {
      /* Normalize edge spacing for mobile viewports */
      .header, .gallery-intro, .footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .header {
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .nav-links {
        gap: 16px;
      }

      .gallery-intro {
        padding-top: 24px;
        padding-bottom: 12px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        padding: 12px 16px 60px 16px;
        gap: 16px;
      }

      /* Allow full-width images to render naturally without extreme fixed tall ratios */
      .art-card {
        aspect-ratio: auto !important;
      }

      .art-card img {
        height: auto;
        max-height: 75vh;
        object-fit: contain;
      }

      /* Hide floating decorative background graphics on small mobile screens */
      .deco {
        display: none;
      }

      .lightbox {
        padding: 16px;
      }

      .lightbox-close {
        top: 16px;
        right: 20px;
      }
    }
  </style>
</head>

  <!-- LIGHTBOX SCRIPT -->
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    document.querySelectorAll('.art-card img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('active');
      });
      img.addEventListener('contextmenu', e => e.preventDefault());
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
    }
  </script>
